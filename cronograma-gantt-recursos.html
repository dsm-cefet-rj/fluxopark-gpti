<script>
(() => {
  const tasks = [...document.querySelectorAll('.task')];
  const deps = [...document.querySelectorAll('.dep, .dep-head')];
  const clear = () => { tasks.forEach(t => t.classList.remove('dimmed')); deps.forEach(d => d.classList.remove('dimmed','focused')); };
  tasks.forEach(t => {
    const id = t.dataset.id;
    t.addEventListener('mouseenter', () => {
      const rel = new Set([id]);
      deps.forEach(d => { if (d.dataset.from === id || d.dataset.to === id) { rel.add(d.dataset.from); rel.add(d.dataset.to); } });
      tasks.forEach(x => x.classList.toggle('dimmed', !rel.has(x.dataset.id)));
      deps.forEach(d => { const hit = d.dataset.from === id || d.dataset.to === id; d.classList.toggle('focused', hit); d.classList.toggle('dimmed', !hit); });
    });
    t.addEventListener('mouseleave', clear);
  });
})();
</script>
